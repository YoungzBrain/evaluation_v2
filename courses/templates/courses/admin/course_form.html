{% extends 'accounts/admin/base_admin.html' %}
{% block title %}{{ page_title }}{% endblock %}

{% block admin_extra_css %}
<style>
    #spec-row { display: none; }
</style>
{% endblock %}

{% block admin_content %}
<div style="max-width:600px;">
<div class="admin-page-header">
    <h2>📚 {{ page_title }}</h2>
    <a href="{% url 'course_list' %}" class="btn-action btn-edit">← Retour</a>
</div>

<div class="card-dark p-4">
    <form method="POST" id="course-form">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Nom de la matiere <span style="color:#ef4444;">*</span></label>
            <input type="text" name="name" class="form-control"
                   value="{{ object.name|default:v.name|default:'' }}"
                   placeholder="ex : Algorithmique Avancee" required>
        </div>

        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Departement <span style="color:#ef4444;">*</span></label>
                <select name="department" id="dept-select" class="form-select" required>
                    <option value="">-- Choisir --</option>
                    {% for dept in departments %}
                        <option value="{{ dept.pk }}"
                            {% if object.department_id == dept.pk %}selected{% endif %}
                            {% if v.department == dept.pk|stringformat:"s" %}selected{% endif %}>
                            {{ dept.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col">
                <label class="form-label">Niveau <span style="color:#ef4444;">*</span></label>
                <select name="level" class="form-select" required>
                    <option value="">-- Choisir --</option>
                    {% for level in levels %}
                        <option value="{{ level.pk }}"
                            {% if object.level_id == level.pk %}selected{% endif %}
                            {% if v.level == level.pk|stringformat:"s" %}selected{% endif %}>
                            {{ level.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mb-3">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" name="is_general"
                       id="is-general-check" role="switch"
                       {% if object.is_general %}checked{% endif %}
                       {% if not object and v.is_general %}checked{% endif %}>
                <label class="form-check-label" for="is-general-check" style="color:#cbd5e1;">
                    🌐 Cours general <small style="color:#475569;">(visible par tous les etudiants du niveau)</small>
                </label>
            </div>
        </div>

        <div class="mb-4" id="spec-row">
            <label class="form-label">Specialisation concernee</label>
            <select name="specialization" id="spec-select" class="form-select">
                <option value="">-- Aucune / toutes --</option>
                {% for spec in specializations %}
                    <option value="{{ spec.pk }}"
                        data-dept="{{ spec.department_id }}"
                        {% if object.specialization_id == spec.pk %}selected{% endif %}
                        {% if v.specialization == spec.pk|stringformat:"s" %}selected{% endif %}>
                        {{ spec.name }} ({{ spec.department.name }})
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="d-flex gap-3">
            <button type="submit" class="btn-primary-custom">{{ action }}</button>
            <a href="{% url 'course_list' %}" class="btn-action btn-edit" style="padding:0.6rem 1.5rem;">Annuler</a>
        </div>
    </form>
</div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const isGenCheck = document.getElementById('is-general-check');
const specRow    = document.getElementById('spec-row');
const deptSelect = document.getElementById('dept-select');
const specSelect = document.getElementById('spec-select');

function toggleSpecRow() {
    specRow.style.display = isGenCheck.checked ? 'none' : 'block';
}

function filterSpecsByDept() {
    const deptId = deptSelect.value;
    Array.from(specSelect.options).forEach(opt => {
        if (!opt.value) return;
        opt.style.display = (!deptId || opt.dataset.dept === deptId) ? '' : 'none';
    });
}

isGenCheck.addEventListener('change', toggleSpecRow);
deptSelect.addEventListener('change', filterSpecsByDept);

// Init au chargement
toggleSpecRow();
filterSpecsByDept();
</script>
{% endblock %}
