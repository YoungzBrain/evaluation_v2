{% extends 'accounts/base.html' %}
{% block title %}Connexion{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
<div class="card-dark p-4" style="width:100%; max-width:420px;">
    <h4 class="mb-1" style="font-weight:700;">Bienvenue</h4>
    <p style="color:#94a3b8; font-size:0.875rem; margin-bottom:1.5rem;">Connectez-vous a votre espace</p>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" name="identifier" class="form-control"
                   placeholder="votre@email.cm" autofocus required>
        </div>

        <div class="mb-4">
            <label class="form-label">Mot de passe</label>
            <input type="password" name="password" class="form-control"
                   placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary-custom w-100 text-center">Se connecter</button>

        <p class="text-center mt-3" style="color:#94a3b8; font-size:0.875rem;">
            Pas encore de compte ? <a href="{% url 'register' %}" style="color:#6366f1;">S'inscrire</a>
        </p>
    </form>
</div>
</div>
{% endblock %}
