{% extends 'accounts/base.html' %}
{% block title %}Connexion{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
<div class="card p-4 mw-480">
    <h4 class="section-title mb-1">Bienvenue</h4>
    <p class="muted mb-4">Connectez-vous à votre espace</p>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" name="identifier" class="form-control"
                   placeholder="votre@email.cm" autofocus required>
        </div>

        <div class="mb-4">
            <label class="form-label">Mot de passe</label>
            <input type="password" name="password" class="form-control"
                   placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary-custom w-100 text-center">Se connecter</button>

        <p class="text-center mt-3 muted">
            Pas encore de compte ? <a href="{% url 'register' %}" class="link-secondary">S'inscrire</a>
        </p>
    </form>
</div>
</div>
{% endblock %}
