{% extends 'accounts/admin/base_admin.html' %}
{% block title %}{{ page_title }}{% endblock %}

{% block admin_content %}
<div class="mw-520 mx-auto my-4">
<div class="card-dark p-4">
    <h4 class="section-title text-danger mb-3">{{ page_title }}</h4>
    <p class="text-muted-small mb-4">
        Confirmez-vous la suppression du {{ object_type }} <strong class="text-white">« {{ object_name }} »</strong> ?
        <br><span class="text-danger small">Cette action est irreversible.</span>
    </p>
    <form method="POST" class="d-flex gap-3">
        {% csrf_token %}
        <button type="submit" class="btn-action btn-delete btn-action-sm">
            Supprimer
        </button>
        <a href="{% url cancel_url %}" class="btn-action btn-edit btn-action-sm">
            Annuler
        </a>
    </form>
</div>
</div>
{% endblock %}
