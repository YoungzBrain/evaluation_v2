{% extends 'accounts/admin/base_admin.html' %}
{% block title %}{{ page_title }}{% endblock %}

{% block admin_content %}
<div style="max-width:480px; margin:2rem auto;">
<div class="card-dark p-4">
    <h4 style="font-weight:700; color:#ef4444; margin-bottom:0.5rem;">{{ page_title }}</h4>
    <p style="color:#94a3b8; margin-bottom:1.5rem;">
        Confirmez-vous la suppression du {{ object_type }} <strong style="color:#f1f5f9;">« {{ object_name }} »</strong> ?
        <br><span style="color:#ef4444; font-size:0.85rem;">Cette action est irreversible.</span>
    </p>
    <form method="POST" class="d-flex gap-3">
        {% csrf_token %}
        <button type="submit" class="btn-action btn-delete" style="padding:0.5rem 1.2rem;">
            Supprimer
        </button>
        <a href="{% url cancel_url %}" class="btn-action btn-edit" style="padding:0.5rem 1.2rem;">
            Annuler
        </a>
    </form>
</div>
</div>
{% endblock %}
