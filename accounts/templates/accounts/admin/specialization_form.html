{% extends 'accounts/admin/base_admin.html' %}
{% block title %}{{ page_title }}{% endblock %}

{% block admin_content %}
<div class="mw-560 mx-auto">
<div class="admin-page-header">
    <h2>{{ page_title }}</h2>
    <a href="{% url 'specialization_list' %}" class="btn-action btn-edit">← Retour</a>
</div>

<div class="card-dark p-4">
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Departement <span class="text-danger">*</span></label>
            <select name="department" class="form-select" required>
                <option value="">-- Choisir un departement --</option>
                {% for dept in departments %}
                    <option value="{{ dept.pk }}"
                        {% if object.department_id == dept.pk %}selected{% endif %}
                        {% if request.POST.department == dept.pk|stringformat:"s" %}selected{% endif %}>
                        {{ dept.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Nom de la specialisation <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control"
                   value="{{ object.name|default:'' }}" placeholder="ex : Genie Logiciel" required>
        </div>
        <div class="mb-4">
            <label class="form-label">Description <span class="text-secondary">(optionnel)</span></label>
            <textarea name="description" class="form-control" rows="3"
                      placeholder="Description...">{{ object.description|default:'' }}</textarea>
        </div>
        <div class="d-flex gap-3">
            <button type="submit" class="btn-primary-custom">{{ action }}</button>
            <a href="{% url 'specialization_list' %}" class="btn-action btn-edit btn-action-sm">Annuler</a>
        </div>
    </form>

    {% if object %}
    <div class="mt-4 border-top pt-4">
        <h3 class="section-title" style="font-size:1rem;">Actions</h3>
        <div class="d-flex gap-2">
            <a href="{% url 'specialization_delete' object.pk %}" class="btn-danger-sm">Supprimer</a>
        </div>
    </div>
    {% endif %}
</div>
</div>
{% endblock %}
