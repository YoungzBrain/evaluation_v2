{% extends 'accounts/admin/base_admin.html' %}
{% block title %}{{ page_title }}{% endblock %}

{% block admin_content %}
<div class="mw-400 mx-auto">
<div class="admin-page-header">
    <h2>{{ page_title }}</h2>
    <a href="{% url 'level_list' %}" class="btn-action btn-edit">← Retour</a>
</div>

<div class="card-dark p-4">
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Nom du niveau <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control"
                   value="{{ object.name|default:'' }}" placeholder="ex : Annee 1" required>
        </div>
        <div class="mb-4">
            <label class="form-label">Ordre <span class="text-secondary">(pour le tri)</span></label>
            <input type="number" name="order" class="form-control"
                   value="{{ object.order|default:'0' }}" min="0" placeholder="0">
            <small class="text-secondary-small">Les niveaux sont affiches du plus petit au plus grand ordre.</small>
        </div>
        <div class="d-flex gap-3">
            <button type="submit" class="btn-primary-custom">{{ action }}</button>
            <a href="{% url 'level_list' %}" class="btn-action btn-edit btn-action-sm">Annuler</a>
        </div>
    </form>

    {% if object %}
    <div class="mt-4 border-top pt-4">
        <h3 class="section-title" style="font-size:1rem;">Actions</h3>
        <div class="d-flex gap-2">
            <a href="{% url 'level_delete' object.pk %}" class="btn-danger-sm">Supprimer</a>
        </div>
    </div>
    {% endif %}
</div>
</div>
{% endblock %}
