{% extends 'accounts/base.html' %}
{% block title %}Inscription{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
<div class="card-dark p-4" style="width:100%; max-width:480px;">
    <h4 class="mb-1" style="font-weight:700;">Creer un compte</h4>
    <p style="color:#94a3b8; font-size:0.875rem; margin-bottom:1.5rem;">Choisissez votre role pour commencer</p>

    <form method="POST">
        {% csrf_token %}

        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Prenom</label>
                <input type="text" name="first_name" class="form-control" placeholder="Jean" required>
            </div>
            <div class="col">
                <label class="form-label">Nom</label>
                <input type="text" name="last_name" class="form-control" placeholder="Dupont" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" placeholder="vous@ecole.cm" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" name="password" class="form-control" placeholder="Minimum 8 caracteres" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Confirmer le mot de passe</label>
            <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="mb-4">
            <label class="form-label">Je suis</label>
            <div class="d-flex gap-3">
                <div class="form-check flex-fill">
                    <input class="form-check-input" type="radio" name="role" id="role_student" value="student" checked>
                    <label class="form-check-label" for="role_student" style="color:#f1f5f9;">
                        🎓 Etudiant
                    </label>
                </div>
                <div class="form-check flex-fill">
                    <input class="form-check-input" type="radio" name="role" id="role_teacher" value="teacher">
                    <label class="form-check-label" for="role_teacher" style="color:#f1f5f9;">
                        👨‍🏫 Enseignant
                    </label>
                </div>
            </div>
        </div>

        <button type="submit" class="btn-primary-custom w-100 text-center">Creer mon compte</button>

        <p class="text-center mt-3" style="color:#94a3b8; font-size:0.875rem;">
            Deja inscrit ? <a href="{% url 'login' %}" style="color:#6366f1;">Se connecter</a>
        </p>
    </form>
</div>
</div>
{% endblock %}
